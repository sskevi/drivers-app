<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DriversApp</title>
    <link rel="stylesheet" href="/frontend/css/styles.css">
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo" onclick="window.location.href='/'">🚗 DriversApp</div>
            <ul>
                <li><a href="/frontend/pages/instructors.html">Find Instructors</a></li>
                <li><a href="/frontend/pages/register.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container" style="max-width: 500px; padding: 3rem 2rem;">
            <div class="card">
                <h1 class="text-center mb-4">Login</h1>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        Login
                    </button>
                </form>
                
                <p class="text-center mt-3">
                    Don't have an account? 
                    <a href="/frontend/pages/register.html" style="color: #667eea;">Sign up</a>
                </p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 DriversApp. All rights reserved.</p>
    </footer>

    <script src="/frontend/js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const user = await app.login(email, password);
                app.showNotification('Login successful!', 'success');
                
                setTimeout(() => {
                    if (user.role === 'instructor') {
                        window.location.href = '/frontend/pages/dashboard.html';
                    } else {
                        window.location.href = '/frontend/pages/instructors.html';
                    }
                }, 1000);
            } catch (error) {
                app.showNotification(error.message || 'Login failed', 'error');
            }
        });
    </script>
</body>
</html>
